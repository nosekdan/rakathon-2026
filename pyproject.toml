[project]
name = "trial-screen"
version = "0.1.0"
description = "Evidence-grounded clinical trial screening demo"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "openai>=1.68",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.13",
    "pydantic>=2.10",
    # rule engine (trialmatch)
    "pyyaml>=6.0",
    "rank-bm25>=0.2",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110
