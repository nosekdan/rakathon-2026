<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f5f7f6">
  <title>TrialScreen | Klinický screening</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/lucide.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <div class="main-shell">
      <header class="topbar"><div class="topbar-left"><div class="brand"><span class="brand-icon"><i data-lucide="scan-heart"></i></span><span>Trial<span class="brand-light">Screen</span></span></div><div class="breadcrumb">FN Motol a Homolka <span>/</span> Onkologie</div></div><nav class="app-nav" aria-label="Sekce aplikace"><button data-view="matches"><i data-lucide="list-checks"></i>Shoda se studiemi</button><button data-view="overview"><i data-lucide="database"></i>Přehled databáze</button></nav><div class="mode-switch" role="group" aria-label="Zdroj dat"><button data-mode="real" class="selected">Nemocniční data</button><button data-mode="demo">Syntetické demo</button></div></header>
      <div id="demo-banner" class="demo-banner" hidden><i data-lucide="flask-conical"></i><span>Syntetický pacient a studie. Nejde o skutečné klinické výsledky.</span></div>
      <div id="job-banner" class="job-banner" hidden aria-live="polite"></div>
      <main id="main" tabindex="-1"><div class="loading"><span class="spinner"></span>Načítání dokumentace</div></main>
      <footer class="footer"><span>Screening k odbornému posouzení. Nejde o potvrzení zařazení do studie.</span><span><span id="footer-mode">Pseudonymizovaná data · Posunutá data záznamů</span><button class="footer-link" data-view="debug">Data a ladění</button></span></footer>
    </div>
  </div>
  <dialog id="source-dialog" class="source-dialog" aria-labelledby="source-title"><div class="dialog-header"><div><div class="eyebrow">ZDROJOVÝ DOKUMENT</div><h2 id="source-title"></h2></div><button class="icon-button" data-close-dialog aria-label="Zavřít zdroj" title="Zavřít"><i data-lucide="x"></i></button></div><div id="source-meta" class="source-meta"></div><pre id="source-text"></pre></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
