  patient: ["\\bhiv\\s*(?:pozit\\w*|infekc\\w*|nemoc\\w*|\\+(?!\\s*p24))", "infekc\\w*\\s+hiv", "\\baids\\b", "hiv[\\s-]*positive", "\\bhiv[\\s-]*infection"]
